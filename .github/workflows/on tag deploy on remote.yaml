name: "On Tag Deploy on Remote"
env:
    UPLOAD_TO_CRATES_IO: false
    REMOTE_URL: "ghcr.io"
    # REMOTE_URL: "gt.sussywussy.de"
    REPO_NAME: "dlh_duty_plan_converter"
    RUN_TESTS: false
    RUST_VERSION: "1.99"
on:
    push:
        tags:
            # -   "[0-9]+.[0-9]+.[0-9]+"
            -   "*" # execute every time tag is pushed


jobs:
    initialisation:
        name: "Initialisation"
        env:
            working-directory: ${{github.workspace}}
        runs-on: "ubuntu-latest"

        steps:
            -   name: "Checkout Repository"
                uses: "actions/checkout@v6" # makes repository structure available
                with:
                    fetch-depth: 0 # fetch all commits, so all tags can be accessed

            -   name: "NOW"
                id: "now"
                run: "echo \"NOW=$(date +'%Y-%m-%dT%H:%M:%S')\" >> $GITHUB_OUTPUT"  # get datetime, save in NOW, push to output

            -   name: "TAG"
                id: "tag"
                run: "echo \"TAG=$(git describe --tags --abbrev=0)\" >> $GITHUB_OUTPUT" # get tag, save in TAG, push to output

            -   name: "TAG_PREVIOUS"
                id: "tag_previous"
                run: "echo \"TAG_PREVIOUS=$(git tag --sort=-creatordate | sed -n '2p')\" >> $GITHUB_OUTPUT" # get previous tag, save in TAG_PREVIOUS, push to output

            -   name: "TODAY"
                id: "today"
                run: "echo \"TODAY=$(date +'%Y-%m-%d')\" >> $GITHUB_OUTPUT" # get date, save in TODAY, push to output

        outputs: # set step output as job output so other jobs can access
            NOW: ${{steps.now.outputs.NOW}}
            TAG: ${{steps.tag.outputs.TAG}}
            TAG_PREVIOUS: ${{steps.tag_previous.outputs.TAG_PREVIOUS}}
            TODAY: ${{steps.today.outputs.TODAY}}


    test:
        name: "Run Tests"
        env:
            working-directory: ${{github.workspace}}
        needs: ["initialisation"]
        runs-on: "ubuntu-latest"

        steps:
            -   name: "Checkout Repository"
                uses: "actions/checkout@v6"

            -   name: "Install Rust"
                uses: "actions-rust-lang/setup-rust-toolchain@v1"
                with:
                    toolchain: ${{env.RUST_VERSION}}

            -   name: "Check Project Version and Tag Match"
                run: |
                    project_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
                    if [ "$project_version" == "${{needs.initialisation.outputs.TAG}}" ]; then
                        exit 0
                    else
                        exit 1
                    fi

            -   name: "Run Tests"
                if: ${{env.RUN_TESTS == 'true'}}
                run: "cargo test"


    create_release:
        name: "Create Release on Remote"
        env:
            working-directory: ${{github.workspace}}
        needs: ["initialisation", "test"]
        runs-on: "ubuntu-latest"
        permissions:
            contents: "write"

        steps:
            -   name: "Checkout Repository"
                uses: "actions/checkout@v6"
                with:
                    fetch-depth: 0 # fetch all commits, so all tags are accessible

            -   name: "Generate Changelog"
                id: "generate_changelog"
                run: |
                    commit_messages=$(git log --pretty=format:'- %h: %s' '${{needs.initialisation.outputs.TAG_PREVIOUS}}'..'${{needs.initialisation.outputs.TAG}}')
                    {
                        echo "changelog<<EOF" # use heredoc to handle multiline output properly
                        echo "## Changelog"
                        echo ""
                        echo "$commit_messages"
                        echo "EOF"
                    } >> $GITHUB_OUTPUT

            -   name: "Create Release"
                id: "create_release"
                uses: "softprops/action-gh-release@v3"
                with:
                    body: ${{steps.generate_changelog.outputs.changelog}} # release text
                    draft: false
                    prerelease: false
                    name: "${{needs.initialisation.outputs.TODAY}} ${{env.REPO_NAME}} ${{needs.initialisation.outputs.TAG}}" # release title
                    tag_name: ${{github.ref}} # release tag


    build_executables:
        name: "Build Executable for ${{matrix.os}}"
        env:
            working-directory: ${{github.workspace}}
        needs: ["initialisation", "create_release"]
        runs-on: "ubuntu-latest"
        permissions:
            contents: "write"
        strategy:
            matrix:
                os: ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]

        steps:
            -   name: "Checkout Repository"
                uses: "actions/checkout@v4"

            -   name: "Install Rust"
                uses: "actions-rust-lang/setup-rust-toolchain@v1"
                with:
                    target: ${{matrix.os}}
                    toolchain: ${{env.RUST_VERSION}}

            -   name: "Install MinGW Linker"
                if: ${{matrix.os == 'x86_64-pc-windows-gnu'}}
                run: |
                    sudo apt-get update
                    sudo apt-get install -y gcc-mingw-w64-x86-64

            -   name: "Create \"./dist/\" Directory"
                run: "mkdir -p \"./dist/\""

            -   name: "Compile"
                run: "cargo build --release --target ${{matrix.os}}"

            -   name: "Move & Rename Executable"
                if: ${{matrix.os != 'x86_64-pc-windows-gnu'}}
                run: "mv \"./target/${{matrix.os}}/release/${{env.REPO_NAME}}\" \"./dist/${{needs.initialisation.outputs.TODAY}} ${{env.REPO_NAME}} ${{needs.initialisation.outputs.TAG}} ${{matrix.os}}\""

            -   name: "Move & Rename Executable"
                if: ${{matrix.os == 'x86_64-pc-windows-gnu'}}
                run: "mv \"./target/${{matrix.os}}/release/${{env.REPO_NAME}}.exe\" \"./dist/${{needs.initialisation.outputs.TODAY}} ${{env.REPO_NAME}} ${{needs.initialisation.outputs.TAG}} ${{matrix.os}}.exe\""

            -   name: "Attach Executable to Release"
                uses: "softprops/action-gh-release@v3"
                with:
                    files: "./dist/*"


    build_docker_image:
        name: "Build Docker Image"
        env:
            working-directory: ${{github.workspace}}
        needs: ["initialisation", "create_release"]
        runs-on: "ubuntu-latest"
        permissions:
            contents: "write"
            packages: "write"

        steps:
            -   name: "Checkout Repository"
                uses: "actions/checkout@v6"

            -   name: "Remote Actor Lowercase"
                id: "actor_lc"
                run: "echo \"ACTOR_LC=$(echo '${{github.actor}}' | tr '[:upper:]' '[:lower:]')\" >> $GITHUB_OUTPUT"

            -   name: "Install Docker"
                uses: "docker/setup-buildx-action@v4"

            -   name: "Create \"./dist/\" Directory"
                run: "mkdir -p \"./dist/\""

            -   name: "Log In to Remote Docker Registry"
                uses: "docker/login-action@v4"
                with:
                    registry: ${{env.REMOTE_URL}}
                    username: ${{steps.actor_lc.outputs.ACTOR_LC}}
                    password: ${{secrets.ACTIONS_TOKEN || secrets.GITHUB_TOKEN}}

            -   name: "Compile"
                run: "docker build -t \"${{env.REMOTE_URL}}/${{steps.actor_lc.outputs.ACTOR_LC}}/${{env.REPO_NAME}}:${{needs.initialisation.outputs.TAG}}\" --no-cache ."

            -   name: "Add \"latest\" Tag to Docker Image"
                run: "docker tag \"${{env.REMOTE_URL}}/${{steps.actor_lc.outputs.ACTOR_LC}}/${{env.REPO_NAME}}:${{needs.initialisation.outputs.TAG}}\" \"${{env.REMOTE_URL}}/${{steps.actor_lc.outputs.ACTOR_LC}}/${{env.REPO_NAME}}:latest\""

            -   name: "Save Docker Image"
                run: "docker save \"${{env.REMOTE_URL}}/${{steps.actor_lc.outputs.ACTOR_LC}}/${{env.REPO_NAME}}:${{needs.initialisation.outputs.TAG}}\" > \"./dist/${{needs.initialisation.outputs.TODAY}} ${{env.REPO_NAME}} ${{needs.initialisation.outputs.TAG}} docker.tar\""

            -   name: "Attach Docker Image to Release"
                uses: "softprops/action-gh-release@v3"
                with:
                    files: "./dist/*"

            -   name: "Push Docker Images to Remote Registry"
                run: |
                    docker push "${{env.REMOTE_URL}}/${{steps.actor_lc.outputs.ACTOR_LC}}/${{env.REPO_NAME}}:${{needs.initialisation.outputs.TAG}}"
                    docker push "${{env.REMOTE_URL}}/${{steps.actor_lc.outputs.ACTOR_LC}}/${{env.REPO_NAME}}:latest"

    upload_to_crates_io:
        name: "Upload Distributables on crates.io"
        if: ${{vars.UPLOAD_TO_CRATES_IO == 'true'}}
        env:
            working-directory: ${{github.workspace}}
        needs: ["initialisation", "test"]
        runs-on: "ubuntu-latest"

        steps:
            -   name: "Checkout Repository"
                uses: "actions/checkout@v6"

            -   name: "Install Rust"
                uses: "actions-rust-lang/setup-rust-toolchain@v1"
                with:
                    toolchain: ${{env.RUST_VERSION}}

            -   name: "Login to crates.io"
                run: "cargo login ${{secrets.CRATES_IO_TOKEN}}"

            -   name: "Publish to crates.io"
                run: "cargo publish"